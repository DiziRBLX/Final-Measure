name: Feedback
description: Share feedback, suggestions, balance ideas, or recommendations for Final Measure.
title: "[FEEDBACK] "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Final Measure.

        Use this form for suggestions, recommendations, balance feedback, or general thoughts about the game.

  - type: dropdown
    id: feedback_type
    attributes:
      label: What kind of feedback is this?
      options:
        - Recommendation / New Idea
        - Gameplay Feedback
        - Balance Feedback
        - UI / UX Feedback
        - Combat Feedback
        - Movement Feedback
        - Ability Feedback
        - Progression Feedback
        - World / Exploration Feedback
        - Other
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: Explain your idea, recommendation, or concern.
      placeholder: I think...
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this improve the game?
      description: Explain the reasoning behind your feedback.
      placeholder: This would improve the game because...

  - type: textarea
    id: example
    attributes:
      label: Example or possible solution
      description: If you have an example of how this could work, add it here.
      placeholder: One possible way to do this would be...

  - type: dropdown
    id: importance
    attributes:
      label: How important do you think this is?
      options:
        - Low
        - Medium
        - High

  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Add screenshots, videos, references, or anything else that may help.
